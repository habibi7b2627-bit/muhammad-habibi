<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#3aa8ff;font-family:'Segoe UI',Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.logo b{color:#00A2FF}

.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,25,45,.72);backdrop-filter:blur(3px);z-index:10;text-align:center;color:#fff;padding:16px;overflow:hidden}
.hide{display:none!important}
h1{margin:0 0 14px;font:900 clamp(30px,8vw,76px)/1.02 'Arial Black',Impact,sans-serif;letter-spacing:2px;text-shadow:0 4px 0 #0a5a99,0 9px 0 rgba(0,0,0,.35)}

</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
 <div class="row"><div class="logo">ROBLOX <b>OBBY</b> ADVENTURE</div>
 <div class="pill" id="sC"></div><div class="pill" id="sS"></div><div class="pill" id="sT"></div><div class="pill" id="sD"></div></div>

</div>

<button id="jb" data-k="j">LOMPAT</button>

<div id="menu" class="ov">
 <h1><span>ROBLOX</span><br>OBBY <em>ADVENTURE</em></h1>
 <div class="box">Lewati platform, hindari <b style="color:#ff8a4a">LAVA</b>, kumpulkan koin 🪙 dan capai garis <b>FINISH</b>!<br>
 <kbd>W A S D</kbd> / <kbd>↑ ← ↓ →</kbd> bergerak &nbsp; <kbd>SPASI</kbd> lompat<br>Di HP: pakai tombol di layar.</div>
 <button class="btn" id="go">▶ MAIN</button>
</div>

 <div class="win">YOU WIN!</div>
 <div class="box" id="wst"></div>
 <button class="btn" id="again">MAIN LAGI</button>
</div>

<script>
const $=i=>document.getElementById(i);
const cv=$('c'),g=cv.getContext('2d');
let W,H,F;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);F=Math.min(H*.95,W*1.05)}
addEventListener('resize',rs);rs();

/* ---------- audio ---------- */
let ac;
function beep(f,d=.1,ty='square',v=.05,f2){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),n=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}

/* ---------- level ---------- */
const sh=(h,f)=>{const n=parseInt(h.slice(1),16);return`rgb(${(n>>16&255)*f|0},${(n>>8&255)*f|0},${(n&255)*f|0})`};
const boxes=[],solids=[],kills=[],movers=[];
const PAL=['#00A2FF','#02B757','#F7D117','#E2231A','#9B59FF','#FF8A00'];let pi=0;
function B(x0,y0,z0,x1,y1,z1,col,o={}){const b={b:1,x0,y0,z0,x1,y1,z1,c:[sh(col,1),sh(col,.78),sh(col,.6)],st:'rgba(0,0,0,.28)',...o};boxes.push(b);if(o.kill)kills.push(b);else if(o.solid!==false)solids.push(b);return b}
const P=(x,z,w,d,y,col)=>B(x,y-1.2,z,x+w,y,z+d,col||PAL[pi++%6]);
const K=(x,z,w,d,y)=>B(x,y,z,x+w,y+.3,z+d,'#FF5A00',{kill:1,lava:1});
function MV(b,a,s){b.mv={a,s,bx:b.x0,w:b.x1-b.x0,off:0};movers.push(b);return b}

const SPAWN={x:0,y:0,z:2};
P(-5,-3,10,13,0,'#02B757');
P(-1.5,13,3,3,0);P(2.5,18.5,3,3,0);P(-1,24,3,3,.8);P(-4.5,29,3,3,1.6);
MV(P(-1.5,34,3,3,1.6,'#FFFFFF'),3.5,1.2);
P(-5,40,10,7,1.6);P(-5,47,10,7,1.6);
B(-5,1.6,43,5,2.8,44,'#E2231A');
K(-5,48,10,1.3,1.6);
B(-5,1.6,51,0,3.6,52.2,'#F7D117');
P(-.8,54,1.6,6,1.6,'#393B3D');P(-.8,60,1.6,6,1.6,'#393B3D');
MV(B(-.6,1.6,61,.6,2.8,62.2,'#E2231A',{kill:1}),3,1.8);
P(-3,67,6,4,1.6,'#02B757');
for(let i=0;i<5;i++)P(-2,72+3*i,4,2,2.4+.8*i,PAL[i%6]);
P(2,88.5,3,3,5.6);P(-3,93,3,3,5.6);P(1.5,97.5,3,3,4.8);P(-3,102,3,3,4);
P(-4,106,8,6,3.2,'#00A2FF');K(-4,108.5,8,1.3,3.2);
P(-6,114,12,6,3.2,'#02B757');P(-6,120,12,6,3.2,'#02B757');
for(let i=0;i<12;i++)for(let j=0;j<2;j++)B(-6+i,3.2,121+j*.5,-5+i,3.27,121.5+j*.5,(i+j)%2?'#111111':'#FFFFFF',{solid:false,st:null});
B(-6,3.2,121,-5.4,9,122,'#E2231A',{solid:false});B(5.4,3.2,121,6,9,122,'#E2231A',{solid:false});B(-6,8.2,121,6,9.2,122,'#E2231A',{solid:false});
const FINISH_Z=121;
const CL=[[0,1.3,14.5],[4,1.3,20],[.5,2.1,25.5],[-3,2.9,30.5],[0,3.1,35.5],[-3.5,2.9,43.5],[3.5,2.9,46],[0,3.8,48.6],[-2,2.9,50],[3.5,2.9,53],[0,2.9,57],[0,2.9,63.5],[0,2.9,69],[0,3.7,73],[0,4.5,76],[0,5.3,79],[0,6.1,82],[0,6.9,85],[3.5,6.9,90],[-1.5,6.9,94.5],[3,6.1,99],[-1.5,5.3,103.5],[0,4.5,107],[0,5.3,108.9],[0,4.5,111],[-4,4.5,117],[4,4.5,118.5]];
const coins=CL.map(c=>({coin:1,x:c[0],y:c[1],z:c[2],got:0,k:0}));

/* ---------- state ---------- */
const PH=2.6,SPD=7.5,GRAV=32,JUMP=12;
const p={x:0,y:0,z:2,ground:null};
let vy=0,coy=0,jb=0,walkT=0,moving=0,T=0,state='menu',time=0,deaths=0,got=0,maxZ=0,bonus=0;
const cam={x:0,y:6.5,z:-9};
const PITCH=.3,cp=Math.cos(PITCH),sp=Math.sin(PITCH),NEAR=.3;
const score=()=>got*100+Math.floor(maxZ)*5+bonus;
const fmt=t=>(t/60|0)+':'+String(t%60|0).padStart(2,'0');

function respawn(){p.x=SPAWN.x;p.y=SPAWN.y;p.z=SPAWN.z;vy=0;p.ground=null;snapCam()}
function snapCam(){cam.x=p.x*.65;cam.y=p.y+6.5;cam.z=p.z-11}
function reset(){coins.forEach(c=>c.got=0);got=0;time=0;deaths=0;maxZ=0;bonus=0;respawn()}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1300)}
function die(){deaths++;beep(300,.4,'sawtooth',.07,60);toast('🔥 Jatuh ke lava! Kembali ke awal');respawn()}
function win(){state='win';bonus=Math.max(0,1500-Math.floor(time)*10);beep(660,.5,'triangle',.08,1320);
 $('wst').innerHTML=`🪙 Koin: <b>${got}/${coins.length}</b><br>⏱ Waktu: <b>${fmt(time)}</b> &nbsp; 💀 Jatuh: <b>${deaths}</b><br>⭐ Skor akhir: <b>${score()}</b>`;
 const w=$('winov');w.classList.remove('hide');for(let i=0;i<70;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${Math.random()*100}%;background:${PAL[i%6]};animation-delay:${Math.random()*2}s;animation-duration:${2+Math.random()*2}s`;w.appendChild(d)}}
function start(){document.querySelectorAll('.cf').forEach(e=>e.remove());$('menu').classList.add('hide');$('winov').classList.add('hide');reset();state='play';beep(440,.12,'triangle',.06,880)}
$('go').onclick=start;$('again').onclick=start;

/* ---------- input ---------- */
const KS={},map={KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',Space:'j'};
addEventListener('keydown',e=>{const k=map[e.code];if(k){e.preventDefault();KS[k]=1;if(k=='j'&&!e.repeat){jb=.12;if(state=='menu')start()}}if(e.code=='Enter'&&state!='play')start()});
addEventListener('keyup',e=>{const k=map[e.code];if(k)KS[k]=0});
addEventListener('blur',()=>{for(const k in KS)KS[k]=0});
document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
 const on=e=>{e.preventDefault();KS[k]=1;el.classList.add('on');if(k=='j')jb=.12},off=e=>{e.preventDefault();KS[k]=0;el.classList.remove('on')};
 el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,off));el.addEventListener('contextmenu',e=>e.preventDefault())});

/* ---------- physics ---------- */
const hit=b=>p.x-.4<b.x1&&p.x+.4>b.x0&&p.z-.4<b.z1&&p.z+.4>b.z0&&p.y<b.y1-.001&&p.y+PH>b.y0+.001;
function worldStep(){for(const m of movers){const o=m.mv.a*Math.sin(T*m.mv.s),d=o-m.mv.off;m.ddx=d;m.mv.off=o;m.x0=m.mv.bx+o;m.x1=m.x0+m.mv.w}}
function upd(dt){
 const play=state=='play';
 let ax=play?(KS.r?1:0)-(KS.l?1:0):0,az=play?(KS.u?1:0)-(KS.d?1:0):0;
 const l=Math.hypot(ax,az);if(l){ax/=l;az/=l}
 let mx=ax*SPD*dt,mz=az*SPD*dt;
 if(p.ground&&p.ground.ddx)mx+=p.ground.ddx;
 p.x+=mx;for(const b of solids)if(hit(b)){const d=mx!=0?mx:(p.x<(b.x0+b.x1)/2?-1:1);p.x=d>0?b.x0-.401:b.x1+.401}
 p.z+=mz;for(const b of solids)if(hit(b)){const d=mz!=0?mz:(p.z<(b.z0+b.z1)/2?-1:1);p.z=d>0?b.z0-.401:b.z1+.401}
 jb-=dt;if(play&&jb>0&&coy>0){vy=JUMP;coy=0;jb=0;beep(520,.14,'square',.04,900)}
 vy-=GRAV*dt;p.y+=vy*dt;let onG=false;p.ground=null;
 for(const b of solids)if(hit(b)){if(vy<=0){p.y=b.y1;vy=0;onG=true;p.ground=b}else{p.y=b.y0-PH-.001;vy=0}}
 coy=onG?.1:coy-dt;
 moving=l>0;walkT+=dt*(onG?13:5)*(l?1:0);
 if(play){
  time+=dt;
  if(p.y<-1.1)return die();
  for(const k of kills)if(p.x+.25>k.x0&&p.x-.25<k.x1&&p.z+.25>k.z0&&p.z-.25<k.z1&&p.y<k.y1-.05&&p.y+PH>k.y0)return die();
  for(const c of coins)if(!c.got&&Math.abs(p.x-c.x)<.9&&Math.abs(p.z-c.z)<.9&&Math.abs(p.y+1.3-c.y)<1.6){c.got=1;got++;beep(988,.08,'square',.05);setTimeout(()=>beep(1319,.12,'square',.05),70)}
  if(p.z>maxZ)maxZ=p.z;
  if(p.z>FINISH_Z)win();
 }
}

/* ---------- rendering ---------- */
const cs=(x,y,z)=>{const dx=x-cam.x,dy=y-cam.y,dz=z-cam.z;return[dx,dy*cp+dz*sp,-dy*sp+dz*cp]};
const scr=v=>[W/2+F*v[0]/v[2],H/2-F*v[1]/v[2]];
function poly(vs,fill,stroke){
 const o=[],n=vs.length;
 for(let i=0;i<n;i++){const a=vs[i],b=vs[(i+1)%n],ai=a[2]>NEAR,bi=b[2]>NEAR;
  if(ai)o.push(a);
  if(ai!==bi){const t=(NEAR-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR])}}
 if(o.length<3)return;
 g.beginPath();o.forEach((v,i)=>{const s=scr(v);i?g.lineTo(s[0],s[1]):g.moveTo(s[0],s[1])});g.closePath();
 g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}}
function face(A,Bq,D){
 if(A[2]<NEAR||Bq[2]<NEAR||D[2]<NEAR)return;
 const Q=(u,v)=>scr([A[0]+(Bq[0]-A[0])*u+(D[0]-A[0])*v,A[1]+(Bq[1]-A[1])*u+(D[1]-A[1])*v,A[2]+(Bq[2]-A[2])*u+(D[2]-A[2])*v]);
 const a=Q(0,.5),b=Q(1,.5),w=Math.hypot(b[0]-a[0],b[1]-a[1]);
 g.fillStyle='#111';for(const e of[Q(.28,.58),Q(.72,.58)]){g.beginPath();g.ellipse(e[0],e[1],w*.06,w*.09,0,0,7);g.fill()}
 const s0=Q(.28,.3),s1=Q(.5,.16),s2=Q(.72,.3);
 g.strokeStyle='#111';g.lineWidth=Math.max(1,w*.05);g.lineCap='round';g.beginPath();g.moveTo(s0[0],s0[1]);g.quadraticCurveTo(s1[0],s1[1],s2[0],s2[1]);g.stroke()}
function drawBox(b){
 const{x0,y0,z0,x1,y1,z1}=b;
 const A=cs(x0,y0,z0),Bq=cs(x1,y0,z0),C=cs(x1,y1,z0),D=cs(x0,y1,z0),E=cs(x0,y0,z1),Fq=cs(x1,y0,z1),G=cs(x1,y1,z1),Hq=cs(x0,y1,z1);
 let c=b.c;if(b.lava){const L=.5+.5*Math.sin(T*4+b.z0);c=[`rgb(255,${90+L*70|0},0)`,'rgb(210,60,0)','rgb(170,40,0)']}
 const st=b.st;
 if(cam.x<x0)poly([A,D,Hq,E],c[2],st);else if(cam.x>x1)poly([Bq,Fq,G,C],c[2],st);
 if(cam.z<z0){poly([A,Bq,C,D],c[1],st);if(b.face)face(A,Bq,D)}else if(cam.z>z1)poly([E,Fq,G,Hq],c[1],st);
 if(cam.y>y1)poly([D,C,G,Hq],c[0],st)}
function drawCoin(c){
 const q=cs(c.x,c.y+Math.sin(T*3+c.z)*.15,c.z);if(q[2]<NEAR)return;
 const s=scr(q),r=F*.5/q[2],w=Math.max(r*.12,r*Math.abs(Math.cos(T*3+c.x)));
 g.fillStyle='#C98A00';g.beginPath();g.ellipse(s[0],s[1],w+r*.07,r+r*.07,0,0,7);g.fill();
 g.fillStyle='#FFD21F';g.beginPath();g.ellipse(s[0],s[1],w,r,0,0,7);g.fill();
 g.fillStyle='#FFF1A0';g.beginPath();g.ellipse(s[0]-w*.25,s[1]-r*.2,w*.35,r*.4,0,0,7);g.fill()}
function label(t,x,y,z,size,col){const q=cs(x,y,z);if(q[2]<NEAR)return;const s=scr(q),f=Math.max(9,size*F/q[2]);g.font=`900 ${f}px Arial Black,Arial`;g.textAlign='center';g.lineWidth=f*.18;g.strokeStyle='rgba(0,0,0,.65)';g.strokeText(t,s[0],s[1]);g.fillStyle=col;g.fillText(t,s[0],s[1])}
const cmp=(a,b)=>{if(a.b&&b.b&&a.x0<b.x1&&a.x1>b.x0&&a.z0<b.z1&&a.z1>b.z0){if(a.y0>=b.y1-.05)return 1;if(b.y0>=a.y1-.05)return-1}return b.k-a.k};
const clouds=Array.from({length:7},(_,i)=>({x:i/7,y:.06+(i*37%25)/100,s:.7+(i*13%10)/12,v:6+i*2}));

function playerParts(){
 const sw=Math.sin(walkT)*.3*(moving?1:0),air=vy!=0&&!p.ground,ay=air?.25:0,out=[];
 const add=(x0,y0,z0,x1,y1,z1,col,fc)=>{const o={b:1,x0:p.x+x0,y0:p.y+y0,z0:p.z+z0,x1:p.x+x1,y1:p.y+y1,z1:p.z+z1,c:[sh(col,1),sh(col,.78),sh(col,.6)],st:'rgba(0,0,0,.35)',face:fc};const dx=(o.x0+o.x1)/2-cam.x,dy=(o.y0+o.y1)/2-cam.y,dz=(o.z0+o.z1)/2-cam.z;o.k=dx*dx+dy*dy+dz*dz;out.push(o)};
 add(-.4,0,-.2+sw,-.02,.9,.2+sw,'#A4BD47');add(.02,0,-.2-sw,.4,.9,.2-sw,'#A4BD47');
 add(-.4,.9,-.2,.4,2,.2,'#0D69AC');
 add(-.8,.9+ay,-.2-sw,-.4,2+ay,.2-sw,'#F5CD30');add(.4,.9+ay,-.2+sw,.8,2+ay,.2+sw,'#F5CD30');
 add(-.35,2,-.35,.35,2.7,.35,'#F5CD30',1);
 return out}

function render(){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2f9bff');gr.addColorStop(.55,'#9fdcff');gr.addColorStop(1,'#eaf7ff');
 g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='#FFE45C';g.beginPath();g.arc(W*.82,H*.14,Math.min(W,H)*.07,0,7);g.fill();
 g.fillStyle='rgba(255,255,255,.9)';
 for(const c of clouds){const x=((c.x*W+T*c.v)%(W+300))-150,y=c.y*H,s=c.s*Math.min(W,H)*.07;
  g.beginPath();g.ellipse(x,y,s*1.6,s*.6,0,0,7);g.ellipse(x-s*.8,y+s*.15,s,s*.45,0,0,7);g.ellipse(x+s,y+s*.1,s*1.1,s*.5,0,0,7);g.fill()}
 // lava floor
 for(let x=-40;x<40;x+=10)for(let z=-20;z<150;z+=10){
  if(z+10<cam.z)continue;
  const L=Math.sin(T*2+x*.3+z*.2),col=`hsl(${16+10*L},100%,${((x+z)/10&1)?50:45}%)`;
  poly([cs(x,-1.5,z),cs(x+10,-1.5,z),cs(x+10,-1.5,z+10),cs(x,-1.5,z+10)],col,col)}
 // gather
 const before=[],after=[];
 for(const b of boxes){if(b.z1<cam.z+.3||b.z0>cam.z+110)continue;
  const dx=(b.x0+b.x1)/2-cam.x,dy=(b.y0+b.y1)/2-cam.y,dz=(b.z0+b.z1)/2-cam.z;b.k=dx*dx+dy*dy+dz*dz;
  (b.z1<=p.z-.3&&b.y1>p.y+.2&&b.x1>p.x-1.2&&b.x0<p.x+1.2?after:before).push(b)}
 for(const c of coins){if(c.got||c.z<cam.z||c.z>cam.z+110)continue;
  const dx=c.x-cam.x,dy=c.y-cam.y,dz=c.z-cam.z;c.k=dx*dx+dy*dy+dz*dz;(c.z<p.z-.3?after:before).push(c)}
 before.sort(cmp);after.sort(cmp);
 for(const o of before)o.coin?drawCoin(o):drawBox(o);
 // shadow
 let sy=-1e9;for(const b of solids)if(p.x+.4>b.x0&&p.x-.4<b.x1&&p.z+.4>b.z0&&p.z-.4<b.z1&&b.y1<=p.y+.05&&b.y1>sy)sy=b.y1;
 if(sy>-1e8){const q=cs(p.x,sy+.02,p.z);if(q[2]>NEAR){const s=scr(q),r=F*.55/q[2];g.fillStyle=`rgba(0,0,0,${Math.max(.12,.4-(p.y-sy)*.05)})`;g.beginPath();g.ellipse(s[0],s[1],r,r*.4,0,0,7);g.fill()}}
 const pp=playerParts();pp.sort((a,b)=>b.k-a.k);for(const o of pp)drawBox(o);
 label('Noob',p.x,p.y+3.2,p.z,.32,'#fff');
 for(const o of after)o.coin?drawCoin(o):drawBox(o);
 label('FINISH',0,9.7,FINISH_Z+.5,.9,'#F7D117');
}

/* ---------- loop ---------- */
function hud(){$('sC').textContent='🪙 '+got+'/'+coins.length;$('sS').textContent='⭐ '+score();$('sT').textContent='⏱ '+fmt(time);$('sD').textContent='💀 '+deaths;$('bar').firstChild.style.width=Math.min(100,maxZ/FINISH_Z*100)+'%'}
let last=0;
function loop(t){
 const dt=Math.min((t-last)/1000||0,.033);last=t;T+=dt;
 worldStep();upd(dt);
 const k=Math.min(1,dt*6);cam.x+=(p.x*.65-cam.x)*k;cam.y+=(p.y+6.5-cam.y)*k;cam.z+=(p.z-11-cam.z)*k;
 render();hud();requestAnimationFrame(loop)}
respawn();requestAnimationFrame(loop);
</script></body></html>
